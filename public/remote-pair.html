<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair your phone · Computer Remote</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111216; color: #f1f2f4; font: 17px/1.5 system-ui, Segoe UI, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  #qr { background: #fff; padding: 18px; border-radius: 18px; display: inline-block; margin: 18px 0; }
  #qr img, #qr svg { display: block; width: 300px; height: 300px; }
  .muted { color: #9096a3; font-size: 14px; max-width: 520px; margin: 8px auto; }
  code { background: #1c1e24; padding: 8px 10px; border-radius: 8px; display: inline-block; word-break: break-all; font-size: 13px; max-width: 520px; }
  button { margin-top: 10px; padding: 10px 16px; border-radius: 10px; border: 0; background: #ff6a2b; color: #fff; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<div>
  <h1>📱 Pair your phone</h1>
  <p>Open your Android <b>camera</b> and point it at this code, then tap the link.</p>
  <div id="qr"></div>
  <p class="muted">Tip: on the phone page, tap ⋮ → <b>Add to Home screen</b> so it's one tap next time.</p>
  <p class="muted">No camera? Open <b id="site"></b> on your phone and paste this key:</p>
  <code id="key"></code><br><button id="copy">Copy key</button>
  <p class="muted">Keep this key secret. Close this tab when you're done.</p>
</div>
<script src="/vendor/qrcode.js"></script>
<script>
  const m = /key=([A-Za-z0-9_-]{32,128})/.exec(location.hash);
  const key = m ? m[1] : '';
  history.replaceState(null, '', location.pathname); // hide the key from the address bar
  const link = location.origin + '/remote#key=' + key;
  document.getElementById('site').textContent = location.origin + '/remote';
  if (key) {
    const qr = qrcode(0, 'M'); qr.addData(link); qr.make();
    document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
    document.getElementById('key').textContent = key;
  } else document.getElementById('qr').textContent = 'No key. Run "Pair phone" from the Computer Remote folder.';
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(key).then(() => { document.getElementById('copy').textContent = 'Copied!'; });
</script>
</body>
</html>

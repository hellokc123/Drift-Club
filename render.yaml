# One-click deployment for Render.com (free tier works; WebSockets supported).
# Render reads this file when you create a "Blueprint" from your GitHub repository.
services:
  - type: web
    name: drift-club
    runtime: node
    plan: free
    buildCommand: echo "No build step needed"
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    # Accounts: Render's free disk is wiped on every restart, so accounts live in a free Upstash
    # Redis database. Create one at upstash.com, then paste its REST URL and token here (Render
    # dashboard > Environment). Without them, accounts are kept only until the server restarts.
    envVars:
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

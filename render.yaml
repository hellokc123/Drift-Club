# One-click deployment for Render.com (free tier works; WebSockets supported).
# Render reads this file when you create a "Blueprint" from your GitHub repository.
services:
  - type: web
    name: drift-club
    runtime: node
    plan: free
    buildCommand: echo "No build step needed"
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    # Accounts + boss learning need storage that survives restarts (Render's free disk is wiped).
    # Option A (used here): a private GitHub repo. Set GITHUB_DATA_TOKEN in the Render dashboard to a
    # fine-grained token with Contents: read & write on that repo only.
    # Option B: an Upstash Redis database (UPSTASH_REDIS_REST_URL + UPSTASH_REDIS_REST_TOKEN).
    envVars:
      - key: GITHUB_DATA_TOKEN
        sync: false
      - key: GITHUB_DATA_REPO
        value: hellokc123/Claude-Private-Repo
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
